<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | DJ's Custom Prints</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f7f9; color: #222222; }
    header { background-color: #003366; color: white; text-align: center; padding: 20px 0; }
    main { max-width: 800px; margin: 0 auto; padding: 20px; }
    
    /* Gallery Grid Styling */
    .gallery-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); 
      gap: 15px; 
      margin-bottom: 30px; 
    }
    .gallery-grid img { 
      width: 100%; 
      height: 200px; 
      object-fit: cover; 
      border-radius: 8px; 
      box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
    }
    h2, h3 { color: #003366; text-align: center; }
  </style>
</head>
<body>

  <header>
    <h1>Gallery</h1>
    <nav><a href="index.html" style="color: white;">Back to Home</a></nav>
  </header>

  <main>
    <h2>Our Work</h2>

    <h3>3D Prints</h3>
    <div class="gallery-grid">
      <img src="images/3d%20prints/MontrealCanadienskeychain.jpg" alt="Montreal Canadiens Keychain">
      <img src="images/3d%20prints/angelheart.jpg" alt="Angel Heart">
      <img src="images/3d%20prints/dogkeychain.jpg" alt="Dog Keychain">
      <img src="images/3d%20prints/dogkeychain1.jpg" alt="Dog Keychain 1">
      <img src="images/3d%20prints/jesus.jpg" alt="Jesus">
      <img src="images/3d%20prints/nlcustomcoordinatesjpg.jpg" alt="NL Custom Coordinates">
      <img src="images/3d%20prints/redwings%20back.jpeg" alt="Red Wings Back">
      <img src="images/3d%20prints/redwings%20front.jpeg" alt="Red Wings Front">
      <img src="images/3d%20prints/therockkeychain.jpg" alt="The Rock Keychain">
    </div>

    <h3>Cricut Designs</h3>
    <div class="gallery-grid">
      <img src="images/cricut/both%20custom%20thermosis.jpg" alt="Custom Thermoses">
      <img src="images/cricut/custom%20grandfather%20thermos.jpg" alt="Grandfather Thermos">
      <img src="images/cricut/custom%20grandmother%20thermos.jpg" alt="Grandmother Thermos">
      <img src="images/cricut/gamer%20birthday%20card%20(cover)%20(1).jpg" alt="Gamer Birthday Card Cover">
      <img src="images/cricut/gamer%20birthday%20card%20(inside)%20(1).jpg" alt="Gamer Birthday Card Inside">
    </div>
  </main>

</body>
</html>
